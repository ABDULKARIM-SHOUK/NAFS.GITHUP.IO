:root{--brand:#0B5D4B;--brand2:#13876C;--brand-bg:#E6F2EE;--gold:#C79A1E;--gold2:#E5BC45;--bg:#F3F6F4;--ink:#10251F;--muted:#5D6E68;--card:#fff;--line:#E1E8E5;--soft:#F1F4F3;
--good:#178A4C;--good-bg:#E4F6EB;--bad:#C93A3A;--bad-bg:#FCE9E8;--c:#0B5D4B;--cbg:#E6F2EE;
--fig-ink:#1F3A5F;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Plex,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:inherit;text-decoration:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){body{background:#DCE5E1}#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.08)}}
.screen{display:flex;flex-direction:column;min-height:100vh;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{background:var(--brand);color:#fff;padding:18px 18px 16px;position:relative;overflow:hidden}
.top::after,.shead::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 130%,rgba(255,255,255,.14),transparent 42%),repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 14px)}
.logo{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.em{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:23px;box-shadow:inset 0 -3px 0 var(--gold);flex:none}
.logo b{font-size:19px;font-weight:700;display:block;line-height:1.25}.logo small{font-size:12.5px;opacity:.85;display:block}
.icb{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;margin-inline-start:auto;color:#fff}
.icb svg{width:20px;height:20px}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.hero{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.hero h1{font-size:19px;font-weight:700;line-height:1.5}.hero p{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:2px}
.hero svg{flex:none}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.sub{background:#fff;border-radius:18px;border:1px solid var(--line);padding:14px;display:flex;gap:12px;align-items:center;text-align:start;width:100%;transition:transform .15s}
.sub:active{transform:scale(.985)}
.sub .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
.sub .ic svg{width:34px;height:34px}
.sub h3{font-size:17.5px;font-weight:700}.sub p{font-size:12.8px;color:var(--muted);margin-top:1px;line-height:1.6}
.grow{flex:1;min-width:0}
.bar{height:7px;border-radius:9px;background:#E7EDEA;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .5s}

/* ===== math helper library (random numbers, question builders, SVG figures) ===== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* multiple choice: question text, correct answer, list of wrong candidates (must give 3 distinct) */
function Q(q, a, wrong, o) {

  b: 'يظنّ كثيرون أن المرجان صخورٌ ملوّنة أو نباتات، والحقيقة أنه حيوانات صغيرة جدًّا تُسمّى «البوليبات»، تعيش في مستعمرات ضخمة، وتبني حولها هياكل كلسية صلبة تتراكم على مدى مئات السنين لتكوّن الشعاب المرجانية.\nيُعدّ البحر الأحمر من أغنى بحار العالم بالشعاب المرجانية؛ إذ تعيش فيه مئات الأنواع منها، ويحتضن أكثر من ألف نوع من الأسماك، بعضها لا يوجد في أي مكان آخر في العالم.\nتؤدي الشعاب أدوارًا مهمة؛ فهي مأوى وغذاء لكائنات بحرية كثيرة، وتحمي الشواطئ من قوة الأمواج، وتجذب السيّاح وهواة الغوص.\nلكنّ الشعاب تواجه أخطارًا، أبرزها ارتفاع حرارة مياه البحار الذي يسبّب «ابيضاض المرجان»، والتلوث، ورمي المراسي فوقها، ولمس الغوّاصين لها. ولحمايتها أنشأت المملكة محميات بحرية، وتُطبَّق أنظمة تمنع الصيد الجائر وإلقاء المخلفات.',
